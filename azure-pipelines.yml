trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.14'
  imageName: 'sentinelrag'
  acrName: 'sentinelragacr'
  acrLoginServer: 'sentinelragacr.azurecr.io'

steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python $(pythonVersion)'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install Python dependencies'

  - script: |
      python -m compileall -q app
    displayName: 'Validate Python syntax'

  - script: |
      docker build -t $(imageName):$(Build.BuildId) .
    displayName: 'Build SentinelRAG Docker image'

  - task: AzureCLI@2
    displayName: 'Push image to Azure Container Registry'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      azureSubscription: 'rg-sentinelrag-dev'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az acr login --name "$(acrName)"

        docker tag "$(imageName):$(Build.BuildId)" \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        echo "Published $(acrLoginServer)/$(imageName):$(Build.BuildId)"

