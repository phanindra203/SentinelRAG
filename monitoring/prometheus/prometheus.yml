
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/sentinelrag-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: sentinelrag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["4.224.164.114"]
    http_headers:
      X-API-Key:
        files:
          - /etc/prometheus/secrets/sentinelrag-api-key
