global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: sentinelrag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    http_headers:
      X-API-Key:
        files:
          - /etc/prometheus/secrets/sentinelrag-api-key
